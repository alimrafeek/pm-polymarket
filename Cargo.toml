[package]
name = "pm-polymarket"
version = "0.1.0"
edition = "2021"

[dependencies]
venue-core = { path = "../venue-core" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tungstenite = "0.24"
futures-util = "0.3"
url = "2"
http = "1"
alloy = { version = "1", default-features = false, features = ["std", "sol-types", "dyn-abi"] }
k256 = "0.13"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = "1"

[dev-dependencies]
# `dec!` in the ERC-7739 signing tests that moved in with `trade.rs`.
rust_decimal_macros = "1"
